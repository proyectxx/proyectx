<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faucet AWERT - Sepolia</title>
    <link rel="stylesheet" href="sepolia.css">
</head>
<body>

<div class="container">
    <header>
        <h2>AWERT Faucet<br />
            (Sepolia Testnet)</h2>
        <button id="connectBtn" onclick="connectWallet()">Conectar MetaMask</button>
        <p id="networkStatus">Red: Desconectado</p>
    </header>

    <!-- Área del Grifo -->
    <div id="faucetView" class="tab-content active">
        <h3>Grifo del Token (Faucet)</h3>
        <p class="subtitle">Recibe 1,000 AWERT<br />
            cada 7 días pagando tarifa fija.</p>
        <div class="pool-info blue-pool">Stock de Faucet: <span id="faucetPoolAmount">0</span> AWERT</div>
        <button onclick="claimFaucet()" class="action-btn claim-btn">Reclamar 1,000 AWERT<br /> 
            (price 0.01 ETH)</button>
    </div>

    <!-- Mensajes del Sistema -->
    <p id="logOutput" class="log-box"></p>

    <!-- PANEL EXCLUSIVO DEL PROPIETARIO -->
    <div id="adminPanel" class="admin-box">
        <h3>Panel de Control Admin (Faucet)</h3>
        <p>Extraer tokens de las piscinas del contrato inteligente.</p>
        <input type="number" id="withdrawAmount" placeholder="Monto de AWERT">
        <button onclick="adminWithdraw()" class="action-btn admin-btn">Retirar a Wallet Principal</button>
    </div>
</div>

<script src="https://cloudflare.com"></script>
<script src="sepolia.js"></script>
</body>
</html>
