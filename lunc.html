<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNC CW20 Token Swap</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://jsdelivr.net"></script>
    <!-- CosmJS para la conexión con la blockchain -->
    <script src="https://github.io"></script>
</head>
<body class="bg-slate-900 text-white font-sans flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-6 bg-slate-800 rounded-2xl shadow-xl border border-slate-700">
        <!-- Encabezado -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold tracking-wide">Swap CW20</h1>
            <button id="btn-connect" class="px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-semibold rounded-xl text-sm transition-all shadow-md">
                Conectar Wallet
            </button>
        </div>

        <!-- Estado de Wallet -->
        <p id="wallet-status" class="text-xs text-slate-400 mb-4 text-center truncate">Wallet no conectada</p>

        <!-- Token de Origen -->
        <div class="bg-slate-900 p-4 rounded-xl mb-3 border border-slate-700">
            <label class="text-xs text-slate-400 block mb-1">Pagas</label>
            <div class="flex justify-between items-center">
                <input id="input-from" type="number" placeholder="0.0" class="bg-transparent text-2xl font-semibold outline-none w-2/3 text-white">
                <select id="select-from" class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-1 text-sm font-medium">
                    <option value="uluna">LUNC</option>
                    <option value="terra1_token_address_1">CW20_A</option>
                </select>
            </div>
        </div>

        <!-- Botón de Inversión (Estético) -->
        <div class="flex justify-center -my-2 relative z-10">
            <button class="bg-slate-700 border border-slate-600 p-2 rounded-full hover:bg-slate-600 transition-all text-sm">
                ⬇️
            </button>
        </div>

        <!-- Token de Destino -->
        <div class="bg-slate-900 p-4 rounded-xl mt-3 mb-6 border border-slate-700">
            <label class="text-xs text-slate-400 block mb-1">Recibes</label>
            <div class="flex justify-between items-center">
                <input id="input-to" type="number" placeholder="0.0" readonly class="bg-transparent text-2xl font-semibold outline-none w-2/3 text-slate-400 cursor-not-allowed">
                <select id="select-to" class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-1 text-sm font-medium">
                    <option value="terra1_token_address_2">CW20_B</option>
                    <option value="uluna">LUNC</option>
                </select>
            </div>
        </div>

        <!-- Detalles del Swap -->
        <div class="space-y-2 mb-6 px-1 text-sm">
            <div class="flex justify-between text-slate-400">
                <span>Tasa de cambio</span>
                <span id="rate-display">1 CW20 = 0 LUNC</span>
            </div>
            <div class="flex justify-between text-slate-400">
                <span>Comisión de red (Gas)</span>
                <span>~0.3%</span>
            </div>
        </div>

        <!-- Botón de Acción -->
        <button id="btn-swap" disabled class="w-full py-4 bg-slate-700 text-slate-400 font-bold rounded-xl text-center cursor-not-allowed transition-all uppercase tracking-wider">
            Ingresa un monto
        </button>
    </div>

    <!-- Lógica de JavaScript -->
    <script>
        let userAddress = null;
        const CHAIN_ID = "columbus-5"; // Red principal de Terra Classic (LUNC)
        const RPC_ENDPOINT = "https://publicnode.com"; // RPC Público de LUNC

        const btnConnect = document.getElementById('btn-connect');
        const walletStatus = document.getElementById('wallet-status');
        const btnSwap = document.getElementById('btn-swap');
        const inputFrom = document.getElementById('input-from');

        // 1. Conectar Billetera (Ejemplo con Station Wallet o Keplr extension)
        btnConnect.addEventListener('click', async () => {
            if (!window.keplr && !window.terraWallets) {
                alert("Por favor instala una billetera compatible con Terra Classic (Keplr o Station).");
                return;
            }

            try {
                // Habilitar la cadena en la extensión (Ejemplo Keplr)
                await window.keplr.enable(CHAIN_ID);
                const offlineSigner = window.keplr.getOfflineSigner(CHAIN_ID);
                const accounts = await offlineSigner.getAccounts();
                
                userAddress = accounts[0].address;
                walletStatus.textContent = `Conectado: ${userAddress.slice(0, 6)}...${userAddress.slice(-4)}`;
                btnConnect.textContent = "Conectado";
                btnConnect.classList.replace('bg-yellow-500', 'bg-emerald-500');
                
                activarBotonSwap();
            } catch (error) {
                console.error("Error al conectar la wallet:", error);
                alert("Error de conexión.");
            }
        });

        // 2. Monitorear inputs para cambiar el estado del botón
        inputFrom.addEventListener('input', () => {
            activarBotonSwap();
        });

        function activarBotonSwap() {
            if (userAddress && inputFrom.value > 0) {
                btnSwap.disabled = false;
                btnSwap.textContent = "Intercambiar Tokens";
                btnSwap.classList.replace('bg-slate-700', 'bg-yellow-500');
                btnSwap.classList.replace('text-slate-400', 'text-slate-950');
                btnSwap.classList.add('hover:bg-yellow-600', 'cursor-pointer');
            } else {
                btnSwap.disabled = true;
                btnSwap.textContent = userAddress ? "Ingresa un monto" : "Conecta la wallet primero";
                btnSwap.className = "w-full py-4 bg-slate-700 text-slate-400 font-bold rounded-xl text-center cursor-not-allowed transition-all uppercase tracking-wider";
            }
        }

        // 3. Ejecutar la transacción de Swap
        btnSwap.addEventListener('click', async () => {
            if (!userAddress) return;

            const amount = inputFrom.value;
            const tokenFrom = document.getElementById('select-from').value;
            const tokenTo = document.getElementById('select-to').value;

            alert(`Iniciando swap de ${amount} desde ${tokenFrom} hacia ${tokenTo}.\n\nPara que esto funcione en producción, debes integrar el contrato inteligente del pool de liquidez (ej. Astroport o Terraswap).`);
            
            // Aquí se estructuraría el mensaje CosmJS / CosmWasm para ejecutar el swap en el contrato inteligente del pool.
        });
    </script>
</body>
</html>
