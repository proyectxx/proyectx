<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATHARIUM (ATH) Swap Portal</title>
    <!-- Importar la librería externa Ethers.js v6 -->
    <script src="https://cloudflare.com"></script>
    <!-- Vinculación del archivo CSS externo -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="swap-container">
    <h2>ATHARIUM Swap<br />
        BTC, ETH, BNB, BASE, HBAR</h2>
    
    <button id="btnConnect" class="btn" onclick="connectWallet()">Conectar Billetera</button>
    <p id="walletAddress" style="font-size:12px; text-align:center; color:#4caf50;"></p>

    <!-- 1. Selección de Red -->
    <div class="input-group">
        <label for="networkSelect">1. Selecciona la Red de Origen</label>
        <select id="networkSelect" onchange="handleNetworkChange()">
            <option value="1">Ethereum Mainnet</option>
            <option value="56">Binance Smart Chain (BSC)</option>
            <option value="295">Hedera Mainnet</option>
            <option value="8453">Base Mainnet</option>
        </select>
    </div>

    <!-- 2. Selección de Token de Pago -->
    <div class="input-group">
        <label for="tokenSelect">2. Intercambiar ATH por:</label>
        <select id="tokenSelect" onchange="updatePriceSimulation()">
            <option value="USDT">USDT (Dólar Tether)</option>
            <option value="BTC">BTC (Bitcoin Encriptado/EVM)</option>
            <option value="ETH">ETH (Ethereum)</option>
            <option value="BNB">BNB (Binance Coin)</option>
            <option value="HBAR">HBAR (Hedera Native/EVM)</option>
            <option value="BASE">ETH on Base (Base Native)</option>
        </select>
    </div>

    <!-- 3. Formulario de Montos -->
    <div class="input-group">
        <label for="amountATH">Cantidad de ATH a vender:</label>
        <input type="number" id="amountATH" placeholder="0.0" oninput="updatePriceSimulation()">
    </div>

    <div class="input-group">
        <label for="amountReceive">Recibirás (Estimado):</label>
        <input type="number" id="amountReceive" placeholder="0.0" disabled>
    </div>

    <button id="btnSwap" class="btn" style="background-color: #28a745;" onclick="executeSwap()" disabled>Ejecutar Intercambio</button>

    <div class="price-info" id="priceOracleInfo">
        Precio Oráculo ETH/USD: Cargando...
    </div>
</div>

<script>
    // REEMPLAZAR: Direcciones de tus tokens ATHARIUM desplegados en cada red
    const TOKEN_ADDRESSES = {
        1: "0x0000000000000000000000000000000000000000",
        56: "0x0000000000000000000000000000000000000000",
        295: "0x0000000000000000000000000000000000000000",
        8453: "0x0000000000000000000000000000000000000000"
    };

    // REEMPLAZAR: Direcciones del contrato Pool de Liquidez en cada red
    const POOL_ADDRESSES = {
        1: "0x0000000000000000000000000000000000000000",
        56: "0x0000000000000000000000000000000000000000",
        295: "0x0000000000000000000000000000000000000000",
        8453: "0x0000000000000000000000000000000000000000"
    };

    // REEMPLAZAR: Direcciones de los tokens de salida (USDT, BTC) reales en cada blockchain
    const OUT_TOKEN_ADDRESSES = {
        "USDT": "0x0000000000000000000000000000000000000000",
        "BTC": "0x0000000000000000000000000000000000000000"
    };

    const ATH_ABI = [
        "function getEthPrice() public view returns (int256)",
        "function approve(address spender, uint256 amount) public returns (bool)"
    ];

    const POOL_ABI = [
        "function swapATHForToken(uint256 _amountATHIn, address _tokenOut) external"
    ];

    // Precios estáticos de referencia cruzada (Mercado simulado para pruebas locales)
    const ASSET_PRICES_USD = { USDT: 1.00, BTC: 92000.00, BNB: 600.00, HBAR: 0.15 };
    let provider, signer, currentEthPriceUSD = 3500;

    async function connectWallet() {
        if (!window.ethereum) return alert("Instala MetaMask.");
        try {
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            const address = await signer.getAddress();
            
            document.getElementById("walletAddress").innerText = `Conectado: ${address.substring(0,6)}...${address.substring(38)}`;
            document.getElementById("btnConnect").innerText = "Billetera Lista";
            document.getElementById("btnSwap").disabled = false;

            const network = await provider.getNetwork();
            document.getElementById("networkSelect").value = network.chainId.toString();
            await fetchOraclePrice();
        } catch (error) {
            alert("Error: " + error.message);
        }
    }

    async function handleNetworkChange() {
        const targetChainId = document.getElementById("networkSelect").value;
        if (!window.ethereum) return;
        try {
            await window.ethereum.request({
                method: 'wallet_switchEthereumChain',
                params: [{ chainId: '0x' + parseInt(targetChainId).toString(16) }],
            });
            await connectWallet();
        } catch (error) {
            alert("Cambia la red manualmente en tu billetera.");
        }
    }

    async function fetchOraclePrice() {
        const chainId = document.getElementById("networkSelect").value;
        const tokenAddress = TOKEN_ADDRESSES[chainId];

        if (!tokenAddress || tokenAddress === "0x0000000000000000000000000000000000000000") {
            document.getElementById("priceOracleInfo").innerText = "Modo de prueba (Configura las direcciones)";
            return;
        }

        try {
            const contract = new ethers.Contract(tokenAddress, ATH_ABI, provider);
            const rawPrice = await contract.getEthPrice();
            currentEthPriceUSD = Number(rawPrice) / 10**8;
            document.getElementById("priceOracleInfo").innerText = `Precio Oráculo: 1 ATH = $${currentEthPriceUSD.toFixed(2)} USD`;
            updatePriceSimulation();
        } catch (err) {
            document.getElementById("priceOracleInfo").innerText = "Usando precio base simulado.";
        }
    }

    function updatePriceSimulation() {
        const amountATH = parseFloat(document.getElementById("amountATH").value);
        if (isNaN(amountATH) || amountATH <= 0) return document.getElementById("amountReceive").value = "";

        const targetToken = document.getElementById("tokenSelect").value;
        const totalValueUSD = amountATH * currentEthPriceUSD;
        let amountToReceive = (targetToken === "ETH" || targetToken === "BASE") ? amountATH : totalValueUSD / (ASSET_PRICES_USD[targetToken] || 1);
        
        document.getElementById("amountReceive").value = amountToReceive.toFixed(6);
    }

    async function executeSwap() {
        const chainId = document.getElementById("networkSelect").value;
        const tokenAddress = TOKEN_ADDRESSES[chainId];
        const poolAddress = POOL_ADDRESSES[chainId];
        const amountATH = document.getElementById("amountATH").value;
        const targetToken = document.getElementById("tokenSelect").value;

        if (tokenAddress.startsWith("0x0000") || poolAddress.startsWith("0x0000")) {
            return alert("Por favor ingresa las direcciones reales de tus contratos en el script.");
        }

        let tokenOutAddress = "0x0000000000000000000000000000000000000000"; // 0x0 para monedas nativas
        if (targetToken === "USDT" || targetToken === "BTC") {
            tokenOutAddress = OUT_TOKEN_ADDRESSES[targetToken];
        }

        try {
            const amountInWei = ethers.parseUnits(amountATH, 18);
            const athContract = new ethers.Contract(tokenAddress, ATH_ABI, signer);
            
            alert("Paso 1: Aprobando el uso de tus tokens ATH en el Pool...");
            const txApprove = await athContract.approve(poolAddress, amountInWei);
            await txApprove.wait();

            alert("Paso 2: Procesando el intercambio en el Pool de Liquidez...");
            const poolContract = new ethers.Contract(poolAddress, POOL_ABI, signer);
            const txSwap = await poolContract.swapATHForToken(amountInWei, tokenOutAddress);
            await txSwap.wait();
            
            alert("¡Swap exitoso!");
        } catch (error) {
            alert("Error en la operación: " + error.message);
        }
    }
</script>
</body>
</html>
