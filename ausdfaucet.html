<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faucet AUSD - Inyección Dinámica JSON</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0c101d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b2c;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 { color: #fcc419; margin-bottom: 5px; }
        .info-box {
            font-size: 0.9em;
            color: #8892b0;
            background: #0c101d;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid #2e3752;
        }
        .info-box strong { color: #ffffff; }
        button {
            width: 100%;
            padding: 14px;
            background-color: #fcc419;
            border: none;
            color: #0c101d;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #e6b017; }
        button:disabled {
            background-color: #343a40;
            color: #8892b0;
            cursor: not-allowed;
        }
        #faucetForm { display: none; margin-top: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            background: #0c101d;
            border: 1px solid #2e3752;
            color: white;
            border-radius: 6px;
            text-align: center;
        }
        #status { margin-top: 15px; font-size: 0.9em; font-weight: 500; white-space: pre-line; }
        .success { color: #00e676; }
        .error { color: #ff1744; }
        #cooldownText { color: #ff9800; font-weight: bold; margin-top: 10px; font-size: 0.95em; }
    </style>
</head>
<body>

<div class="container">
    <h1>Faucet AUSD</h1>
    <p>Reclama tus tokens realizando el depósito obligatorio</p>
    
    <div class="info-box">
        <strong>Contrato AUSD:</strong> <span style="font-size:0.8em; word-break:break-all;">terra1ug772wjenmm8mphzq0pvgvxrkgd9axngv7swrvrt3dj35sn9fmls626vml</span><br><br>
        <strong>Costo por reclamo:</strong> <span id="costoTexto">50 LUNC</span><br>
        <strong>Recompensa:</strong> 10,000 AUSD<br>
        <strong>Límite:</strong> 1 reclamo cada 72 horas<br>
        <strong>Destinatario LUNC:</strong> <span style="font-size:0.8em; word-break:break-all;">terra1hc0ufrxa6uw62qgm4p0ljvzenaypt70kmc4xyu</span>
    </div>

    <button id="connectBtn" onclick="connectWallet()">Conectar Terra Station</button>
    
    <div id="faucetForm">
        <input type="text" id="walletAddress" readonly>
        <button id="claimBtn" onclick="enviarTransaccionDinamica()">Pagar y Reclamar AUSD</button>
        <div id="cooldownText"></div>
    </div>

    <div id="status"></div>
</div>

<script>
      const COBRO_LUNC = 50; 
    const FAUCET_COOLDOWN = 72 * 60 * 60 * 1000; 
    const CHAIN_ID = "columbus-5";
    
    const txTemplate = {
      "chain_id": "columbus-5";
      "msgs": [
        {
          "type": "bank/MsgSend",
          "value": {
            "from_address": "{{USER_ADDRESS}}", 
            "to_address": "terra1hc0ufrxa6uw62qgm4p0ljvzenaypt70kmc4xyu",
            "amount": [{ "amount": "50000000", "denom": "uluna" }] 
          }
        },
        {
          "type": "wasm/MsgExecuteContract",
          "value": {
            "sender": "{{USER_ADDRESS}}", 
            "contract": "terra1ug772wjenmm8mphzq0pvgvxrkgd9axngv7swrvrt3dj35sn9fmls626vml",
            "execute_msg": {
              "transfer": {
                "recipient": "{{USER_ADDRESS}}", 
                "amount": "10000000000" 
              }
            },
            "coins": []
          }
        }
      ]
    };
    
    let userAddress = "";
    let timerInterval;
    let signClient; 
    let currentSession = null;

    document.getElementById('costoTexto').innerText = `${COBRO_LUNC} LUNC`;

    async function connectWalletConnect() {
        const statusDiv = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
        
        connectBtn.disabled = true;
        statusDiv.className = "";
        statusDiv.innerText = "Iniciando WalletConnect...";

        try {
            // Inicializar el cliente oficial v2 con una clave de proyecto pública estable
            signClient = await WalletConnectSignClient.init({
                projectId: "3fcc6bba6e1b4369bc9229e710b14644" 
            });

            statusDiv.innerText = "Generando enlace de emparejamiento...";
            
            // Solicitar permisos específicos para el Namespace de Cosmos/Terra Classic
            const { uri, approval } = await signClient.connect({
                requiredNamespaces: {
                    cosmos: {
                        methods: ["cosmos_signAmino", "cosmos_signDirect"],
                        chains: ["cosmos:columbus-5"],
                        events: []
                    }
                }
            });

            if (uri) {
                // Abre el Deep Link para conectar de manera inmediata en dispositivos móviles
                window.location.href = `terra://wc?uri=${encodeURIComponent(uri)}`;
                
                statusDiv.innerText = "Por favor, aprueba la solicitud de conexión en tu aplicación Station Wallet.";
            }

            // Esperar la confirmación del emparejamiento del usuario
            currentSession = await approval();
            
            // Extraer la billetera devuelta por la app móvil
            const cosmosNamespace = currentSession.namespaces.cosmos;
            if (cosmosNamespace && cosmosNamespace.accounts.length > 0) {
                // Estructura devuelta típica: "cosmos:columbus-5:terra1..."
                const parts = cosmosNamespace.accounts[0].split(":");
                userAddress = parts[parts.length - 1]; 
                
                document.getElementById('walletAddress').value = `Cuenta: ${userAddress}`;
                connectBtn.style.display = 'none';
                document.getElementById('faucetForm').style.display = 'block';
                statusDiv.innerText = "";
                
                checkCooldown();
            } else {
                throw new Error("No se devolvieron cuentas válidas para la red Terra.");
            }

        } catch (err) {
            statusDiv.className = "error";
            statusDiv.innerText = "Error al conectar: " + err.message;
            connectBtn.disabled = false;
        }
    }

    function checkCooldown() {
        clearInterval(timerInterval);
        const claimBtn = document.getElementById('claimBtn');
        const cooldownText = document.getElementById('cooldownText');
        
        const lastClaimKey = `last_claim_${userAddress}`;
        const lastClaim = localStorage.getItem(lastClaimKey);

        if (lastClaim) {
            const timePassed = Date.now() - parseInt(lastClaim);
            if (timePassed < FAUCET_COOLDOWN) {
                claimBtn.disabled = true;
                timerInterval = setInterval(() => {
                    const remainingTime = FAUCET_COOLDOWN - (Date.now() - parseInt(lastClaim));
                    if (remainingTime <= 0) {
                        clearInterval(timerInterval);
                        claimBtn.disabled = false;
                        cooldownText.innerText = "";
                    } else {
                        const hours = Math.floor(remainingTime / (1000 * 60 * 60));
                        const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);
                        cooldownText.innerText = `Próximo reclamo en: ${hours}h ${minutes}m ${seconds}s`;
                    }
                }, 1000);
                return;
            }
        }
        claimBtn.disabled = false;
        cooldownText.innerText = "";
    }

    async function enviarTransaccionWalletConnect() {
        const statusDiv = document.getElementById('status');
        const claimBtn = document.getElementById('claimBtn');
        
        claimBtn.disabled = true;
        statusDiv.className = "";
        statusDiv.innerText = "Enviando solicitud de firma a tu teléfono...";

        try {
            // Reemplazar marcador de posición con la dirección real obtenida de WalletConnect
            let txString = JSON.stringify(txTemplate);
            txString = txString.replaceAll("{{USER_ADDRESS}}", userAddress);
            const finalTx = JSON.parse(txString);

            // Forzar redirección de la app en móviles para que el usuario firme la acción de inmediato
            window.location.href = "terra://wc";

            // Enviar la estructura del mensaje para su aprobación remota
            await signClient.request({
                topic: currentSession.topic,
                chainId: "cosmos:columbus-5",
                request: {
                    method: "cosmos_signAmino",
                    params: {
                        signerAddress: userAddress,
                        signDoc: {
                            chain_id: CHAIN_ID,
                            fee: {amount: [{ amount: "30000000", denom: "uluna" }],gas: "250000"},msgs: finalTx.msgs,memo: "Faucet Claim AUSD"}}}});localStorage.setItem(last_claim_${userAddress}, Date.now().toString());statusDiv.className = "success";statusDiv.innerText = "¡Éxito! Transacción firmada e instrucciones procesadas.";checkCooldown();} catch (err) {statusDiv.className = "error";statusDiv.innerText = "Error en la firma remota: " + err.message;claimBtn.disabled = false;}}
</script>

</body>
</html>
