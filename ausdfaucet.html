<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faucet AUSD - Solo Keplr Wallet</title>
    
    <!-- Vinculación de estilos independientes -->
    <link rel="stylesheet" href="css.css">
    
    <!-- Vinculación de la lógica de Keplr con ejecución diferida -->
    <script src="jsfaucet.js" defer></script>
</head>
<body>

<div class="container">
    <h1>Faucet AUSD</h1>
    <p>Conéctate mediante Keplr para solicitar tus tokens</p>
    
    <div class="info-box">
        <strong>Contrato AUSD:</strong> <span style="font-size:0.8em; word-break:break-all;">terra1ug772wjenmm8mphzq0pvgvxrkgd9axngv7swrvrt3dj35sn9fmls626vml</span><br><br>
        <strong>Costo por reclamo:</strong> <span id="costoTexto">-- LUNC</span><br>
        <strong>Recompensa:</strong> 10,000 AUSD<br>
        <strong>Límite:</strong> 1 reclamo cada 72 horas<br>
        <strong>Destinatario LUNC:</strong> <span style="font-size:0.8em; word-break:break-all;">terra1hc0ufrxa6uw62qgm4p0ljvzenaypt70kmc4xyu</span>
    </div>

    <button id="connectBtn" onclick="connectKeplr()">Conectar Keplr Wallet</button>
    
    <div id="faucetForm">
        <input type="text" id="walletAddress" readonly>
        <button id="claimBtn" onclick="enviarTransaccionKeplr()">Pagar 50 LUNC y Reclamar</button>
        <div id="cooldownText"></div>
    </div>

    <div id="status"></div>
</div>

</body>
</html>
