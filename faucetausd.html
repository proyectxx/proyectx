<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faucet AUSD - Pago en LUNC con Restricción</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0c101d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b2c;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 { color: #fcc419; margin-bottom: 5px; }
        .info-box {
            font-size: 0.9em;
            color: #8892b0;
            background: #0c101d;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid #2e3752;
        }
        .info-box strong { color: #ffffff; }
        button {
            width: 100%;
            padding: 14px;
            background-color: #fcc419;
            border: none;
            color: #0c101d;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #e6b017; }
        button:disabled {
            background-color: #343a40;
            color: #8892b0;
            cursor: not-allowed;
        }
        #faucetForm { display: none; margin-top: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            background: #0c101d;
            border: 1px solid #2e3752;
            color: white;
            border-radius: 6px;
            text-align: center;
        }
        #status { margin-top: 15px; font-size: 0.9em; font-weight: 500; }
        .success { color: #00e676; }
        .error { color: #ff1744; }
        #cooldownText { color: #ff9800; font-weight: bold; margin-top: 10px; font-size: 0.95em; }
    </style>
</head>
<body>

<div class="container">
    <h1>Faucet AUSD</h1>
    <p>Reclama tus tokens realizando el depósito obligatorio</p>
    
    <div class="info-box">
        <strong>Contrato AUSD:</strong> <span style="font-size:0.8em; word-break:break-all;">terra1ug772wjenmm8mphzq0pvgvxrkgd9axngv7swrvrt3dj35sn9fmls626vml</span><br><br>
        <strong>Costo por reclamo:</strong> <span id="costoTexto">50 LUNC</span><br>
        <strong>Recompensa:</strong> 10,000 AUSD<br>
        <strong>Límite:</strong> 1 reclamo cada 72 horas<br>
        <strong>Destinatario LUNC:</strong> <span style="font-size:0.8em; word-break:break-all;">terra1hc0ufrxa6uw62qgm4p0ljvzenaypt70kmc4xyu</span>
    </div>

    <button id="connectBtn" onclick="connectWallet()">Conectar Terra Station</button>
    
    <div id="faucetForm">
        <input type="text" id="walletAddress" readonly>
        <button id="claimBtn" onclick="executeFaucetTransaction()">Pagar y Reclamar AUSD</button>
        <div id="cooldownText"></div>
    </div>

    <div id="status"></div>
</div>

<script>
    // --- CONFIGURACIÓN MODIFICABLE ---
    const COBRO_LUNC = 50; 
    const OWNER_ADDRESS = "terra1hc0ufrxa6uw62qgm4p0ljvzenaypt70kmc4xyu";
    const CONTRACT_ADDRESS = "terra1ug772wjenmm8mphzq0pvgvxrkgd9axngv7swrvrt3dj35sn9fmls626vml";
    const FAUCET_COOLDOWN = 72 * 60 * 60 * 1000; // 72 horas en milisegundos
    
    // Configuración interna (6 decimales)
    const LUNC_MICRO_AMOUNT = (COBRO_LUNC * 1000000).toString(); 
    const AUSD_CLAIM_AMOUNT = "10000000000"; // 10,000 AUSD (con 6 decimales)
    
    let userAddress = "";
    let timerInterval;

    document.getElementById('costoTexto').innerText = `${COBRO_LUNC} LUNC`;
    document.getElementById('claimBtn').innerText = `Pagar ${COBRO_LUNC} LUNC y Reclamar`;

    async function connectWallet() {
        const statusDiv = document.getElementById('status');
        
        if (!window.terraWallets && !window.isTerraExtensionAvailable && !window.terraExtension) {
            statusDiv.className = "error";
            statusDiv.innerText = "Instala la extensión Terra Station o activa la compatibilidad clásica.";
            return;
        }

        try {
            statusDiv.innerText = "Conectando...";
            
            if (window.terraExtension) {
                const res = await window.terraExtension.connect();
                userAddress = res.address;
                
                document.getElementById('walletAddress').value = `Tu cuenta: ${userAddress}`;
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('faucetForm').style.display = 'block';
                statusDiv.innerText = "";
                
                // Verificar si esta billetera específica está en tiempo de espera
                checkCooldown();
            } else {
                statusDiv.className = "error";
                statusDiv.innerText = "Extensión no detectada.";
            }
        } catch (err) {
            statusDiv.className = "error";
            statusDiv.innerText = "Error al conectar: " + err.message;
        }
    }

    function checkCooldown() {
        clearInterval(timerInterval);
        const claimBtn = document.getElementById('claimBtn');
        const cooldownText = document.getElementById('cooldownText');
        
        // Clave única basada en la dirección de la billetera del usuario
        const lastClaimKey = `last_claim_${userAddress}`;
        const lastClaim = localStorage.getItem(lastClaimKey);

        if (lastClaim) {
            const timePassed = Date.now() - parseInt(lastClaim);
            
            if (timePassed < FAUCET_COOLDOWN) {
                claimBtn.disabled = true;
                
                timerInterval = setInterval(() => {
                    const remainingTime = FAUCET_COOLDOWN - (Date.now() - parseInt(lastClaim));
                    
                    if (remainingTime <= 0) {
                        clearInterval(timerInterval);
                        claimBtn.disabled = false;
                        cooldownText.innerText = "";
                    } else {
                        const hours = Math.floor(remainingTime / (1000 * 60 * 60));
                        const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);
                        cooldownText.innerText = `Próximo reclamo en: ${hours}h ${minutes}m ${seconds}s`;
                    }
                }, 1000);
                return;
            }
        }
        claimBtn.disabled = false;
        cooldownText.innerText = "";
    }

    async function executeFaucetTransaction() {
        const statusDiv = document.getElementById('status');
        const claimBtn = document.getElementById('claimBtn');
        
        claimBtn.disabled = true;
        statusDiv.className = "";
        statusDiv.innerText = "Esperando aprobación en Terra Station...";

        try {
            // Mensaje 1: Enviar LUNC (uluna) al propietario
            const msgSendLunc = {
                type: "bank/MsgSend",
                value: {
                    from_address: userAddress,
                    to_address: OWNER_ADDRESS,
                    amount: [{ denom: "uluna", amount: LUNC_MICRO_AMOUNT }]
                }
            };

            // Mensaje 2: Transferencia de 10,000 AUSD desde el contrato
            const msgExecuteCw20 = {
                type: "wasm/MsgExecuteContract",
                value: {
                    sender: userAddress,
                    contract: CONTRACT_ADDRESS,
                    execute_msg: {
                        transfer: {
                            recipient: userAddress,
                            amount: AUSD_CLAIM_AMOUNT
                        }
                    },
                    coins: []
                }
            };

            const txResult = await window.terraExtension.post({
                msgs: [msgSendLunc, msgExecuteCw20]
            });

            // Guardar registro de tiempo asociado a la billetera actual tras el éxito
            localStorage.setItem(`last_claim_${userAddress}`, Date.now().toString());
            
            statusDiv.className = "success";
            statusDiv.innerText = "¡Transacción procesada con éxito!";
            
            // Activar el bloqueo temporal de 72 horas inmediatamente
            checkCooldown();

        } catch (err) {
            statusDiv.className = "error";
            statusDiv.innerText = "Transacción fallida: " + err.message;
            checkCooldown(); // Reevalúa si debe seguir bloqueado o no
        }
    }
</script>

</body>
</html>
