<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Token de Oro CW20</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { color: #f39c12; margin-bottom: 5px; }
        p { color: #aaaaaa; font-size: 14px; }
        
        .countdown-container {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border: 1px solid #f39c12;
        }
        .countdown-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f1c40f;
            margin-bottom: 5px;
        }
        .countdown-timer {
            font-size: 24px;
            font-weight: bold;
            font-family: monospace;
            color: #ffffff;
        }

        .status-box {
            background-color: #2b2b2b;
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-connect { background-color: #3498db; color: white; }
        .btn-connect:hover { background-color: #2980b9; }
        .btn-mint { background-color: #e67e22; color: white; }
        .btn-mint:hover { background-color: #d35400; }
        button:disabled { background-color: #555555; cursor: not-allowed; color: #888888; }
    </style>

    <!-- Cargamos la librería oficial Wallet Provider de Station -->
    <script src="https://unpkg.com"></script>
</head>
<body>

<div class="container">
    <h1>XAUg <br />
    Token de Oro Físico</h1>
    <p>Activación de Inflación Automatizada Anual</p>
    
    <!-- CONTADOR DE TIEMPO REGRESIVO -->
    <div class="countdown-container">
        <div class="countdown-title">Próxima Emisión Disponible En:</div>
        <div id="countdown" class="countdown-timer">Cargando datos...</div>
    </div>

    <div class="status-box" id="wallet-status">
        Billetera: Desconectada
    </div>

    <button id="btn-connect" class="btn-connect">Conectar Station Wallet</button>
    <button id="btn-mint" class="btn-mint" disabled>Ejecutar Acuñación Anual</button>

    <div class="status-box" id="tx-status" style="display: none;">
        Estado TX: Esperando acción...
    </div>
</div>

<script>
    // --- CONFIGURACIÓN DE PARÁMETROS ---
    const CONTRACT_ADDRESS = "REGISTRA_AQUÍ_LA_DIRECCIÓN_DE_TU_CONTRATO_CW20";
    const LCD_URL = "https://terra.dev";
    const UN_ANIO_EN_SEGUNDOS = 31536000;

    let userAddress = null;
    let extensionContainer = null;
    let timerInterval = null;

    window.addEventListener('load', () => {
        if (window.isStationExtensionAvailable) {
            extensionContainer = window.station;
            // Consultar el contrato de inmediato para mostrar el tiempo incluso sin conectar billetera
            obtenerTiempoContrato();
        } else {
            document.getElementById('wallet-status').innerText = "Error: Por favor instala la extensión Station Wallet.";
            document.getElementById('btn-connect').disabled = true;
            document.getElementById('countdown').innerText = "N/A (Requiere Extensión)";
        }
    });

    // Acción: Conectar Billetera
    document.getElementById('btn-connect').addEventListener('click', async () => {
        try {
            if (!extensionContainer) return;
            const res = await extensionContainer.connect();
            userAddress = res.address;

            document.getElementById('wallet-status').innerHTML = `Conectado:<br><strong>${userAddress}</strong>`;
            document.getElementById('btn-connect').style.display = 'none';
        } catch (error) {
            alert("Error al intentar conectar con Station Wallet.");
        }
    });

    // Función para consultar a la Blockchain mediante HTTP GET (Smart Query)
    async function obtenerTiempoContrato() {
        try {
            // Estructura de consulta codificada en Base64 tal como lo requiere el nodo LCD de Terra
            const queryMessage = btoa(JSON.stringify({ get_inflation_status: {} }));
            const response = await fetch(`${LCD_URL}/cosmwasm/wasm/v1/contracts/${CONTRACT_ADDRESS}/smart/${queryMessage}`);
            const data = await response.json();

            if (data && data.data) {
                // Obtenemos la última fecha registrada en el contrato (segundos Unix)
                const lastMintTime = parseInt(data.data.last_mint_time);
                const tiempoObjetivoS = lastMintTime + UN_ANIO_EN_SEGUNDOS;
                
                // Iniciar el reloj en el navegador
                iniciarContadorRegresivo(tiempoObjetivoS * 1000); 
            }
        } catch (e) {
            console.error("Error consultando el contrato:", e);
            document.getElementById('countdown').innerText = "Error al leer contrato";
        }
    }

    // Lógica del reloj visual en tiempo real
    function iniciarContadorRegresivo(targetTimestampMs) {
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            const ahora = Date.now();
            const diferencia = targetTimestampMs - ahora;

            if (diferencia <= 0) {
                clearInterval(timerInterval);
                document.getElementById('countdown').innerText = "¡DISPONIBLE AHORA!";
                document.getElementById('countdown').style.color = "#2ecc71";
                // Habilitar el botón únicamente si ya está conectado
                if (userAddress) document.getElementById('btn-mint').disabled = false;
                return;
            }

            // Cálculos matemáticos de conversión de tiempo
            const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

            // Formatear cadenas de texto para mantener la estética clásica (00:00:00:00)
            const pad = (num) => String(num).padStart(2, '0');
            document.getElementById('countdown').innerText = `${dias}d ${pad(horas)}h ${pad(minutos)}m ${pad(segundos)}s`;
            document.getElementById('btn-mint').disabled = true; // Bloqueado si no es cero
        }, 1000);
    }

    // Acción: Enviar Transacción de Acuñación
    document.getElementById('btn-mint').addEventListener('click', async () => {
        const txStatusBox = document.getElementById('tx-status');
        txStatusBox.style.display = 'block';
        txStatusBox.innerText = "Estado TX: Firmando transacción en tu billetera...";

        try {
            const txPayload = {
                chainID: "columbus-5",
                msgs: [
                    {
                        type: "wasm/MsgExecuteContract",
                        value: {
                            sender: userAddress,
                            contract: CONTRACT_ADDRESS,
                            execute_msg: { trigger_yearly_mint: {} },
                            coins: []
                        }
                    }
                ],
                memo: "Trigger interfaz web de acuñación anual de oro"
            };

            const txResult = await extensionContainer.signAndPost(txPayload);
            
            if (txResult && txResult.success) {
                txStatusBox.style.backgroundColor = "#27ae60";
                txStatusBox.innerHTML = `¡Éxito!<br>Hash TX: <a href="https://hexxagon.net{txResult.result.txhash}" target="_blank" style="color:white;">Ver en el explorador</a>`;
                
                // Forzar una reconexión para refrescar el nuevo temporizador de un año
                setTimeout(obtenerTiempoContrato, 5000);
            } else {
                throw new Error("La transacción falló o fue rechazada.");
            }
        } catch (error) {
            txStatusBox.style.backgroundColor = "#c0392b";
            txStatusBox.innerText = `Error: ${error.message || "Cancelado."}`;
        }
    });
</script>

</body>
</html>
